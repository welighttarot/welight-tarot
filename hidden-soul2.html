<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薇光塔羅 welight_tarot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f0ebff;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 2rem 1rem 4rem;
  font-family: 'Crimson Text', Georgia, serif;
}
.page {
  background: #faf8ff;
  border-radius: 20px;
  padding: 1.8rem 1.6rem 3rem;
  position: relative; overflow: hidden;
  width: 100%; max-width: 560px;
  border: 1px solid rgba(160,100,220,0.12);
  box-shadow: 0 4px 40px rgba(140,90,210,0.1);
}
#heartsCanvas {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
}
.content { position: relative; z-index: 1; }

.cards-row {
  display: flex; justify-content: center; gap: 16px;
  margin-bottom: 1.6rem;
}
.card-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.card-lbl { font-family: 'Cinzel Decorative', serif; color: #c0a0e0; font-size: 12px; letter-spacing: 2px; }

.card-outer {
  width: 96px; height: 158px;
  perspective: 600px; cursor: pointer;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.4,0,0.2,1);
}
.card-outer.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; padding: 10px 8px; text-align: center;
  box-shadow: 0 4px 20px rgba(140,90,210,0.13);
}
.card-back {
  background: linear-gradient(160deg, #f0e8ff 0%, #e8dcff 100%);
  border: 1.5px solid rgba(160,100,220,0.28);
}
.card-back-label { font-family: 'Cinzel Decorative', serif; font-size: 13px; color: #b090d8; letter-spacing: 1px; margin-top: 4px; }
.card-back-hint { font-size: 12px; color: #c8a8e8; margin-top: 2px; }
.card-front {
  border: 1.5px solid rgba(160,100,220,0.22);
  transform: rotateY(180deg);
}
.card-sym { font-size: 30px; }
.card-name-main { font-size: 12px; font-weight: 600; line-height: 1.3; }
.card-name-sub { font-size: 8px; opacity: 0.6; letter-spacing: 0.4px; }

.card-outer:not(.flipped):hover .card-inner {
  transform: translateY(-8px) scale(1.04);
}
.card-outer.flipped { cursor: default; }

.result-area {
  background: white;
  border: 1.5px solid rgba(160,100,220,0.18);
  border-radius: 16px;
  padding: 1.3rem 1.5rem;
  box-shadow: 0 2px 16px rgba(140,90,210,0.09);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

.result-card-header {
  margin-bottom: 1rem;
  padding-bottom: 0.8rem;
  border-bottom: 1px solid rgba(160,100,220,0.12);
}
.result-card-name { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
.result-sym { font-size: 28px; }
.result-name-main { font-size: 18px; font-weight: 600; color: #5828a0; line-height: 1.2; }
.result-name-sub { font-size: 11px; color: #a880c8; margin-top: 2px; }
.drawn-cards {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-top: 0.4rem;
}
.drawn-label { font-family: 'Cinzel Decorative', serif; font-size: 9px; color: #b090d8; letter-spacing: 1px; }
.drawn-names { font-size: 13px; color: #7848b0; letter-spacing: 0.5px; }

.divider { color: rgba(160,100,220,0.3); text-align: center; font-size: 11px; margin-bottom: 1rem; letter-spacing: 3px; }

.status-blocks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
.status-block {
  background: #fdf9ff;
  border: 1px solid rgba(160,100,220,0.13);
  border-radius: 10px; padding: 0.9rem 1.1rem;
}
.status-header { display: flex; align-items: center; gap: 7px; margin-bottom: 0.4rem; }
.status-icon { font-size: 15px; }
.status-label { font-family: 'Cinzel Decorative', serif; font-size: 9px; letter-spacing: 2px; }
.status-text { color: #8878a8; font-size: 14px; line-height: 1.82; }

.suggest-block {
  background: linear-gradient(135deg, #f5f0ff, #f0eaff);
  border: 1px solid rgba(160,100,220,0.18);
  border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 1rem;
}
.suggest-title { font-family: 'Cinzel Decorative', serif; color: #9060c8; font-size: 9px; letter-spacing: 2px; margin-bottom: 0.4rem; }
.suggest-text { color: #9070b0; font-size: 13.5px; line-height: 1.72; }

.cta-block { text-align: center; padding: 0.5rem 0 0.2rem; }
.cta-text { color: #9070b0; font-size: 13.5px; line-height: 1.82; margin-bottom: 0.9rem; }
.cta-text span { color: #7040b0; }
.line-btn {
  display: inline-block;
  background: linear-gradient(135deg, #7030b0 0%, #9050d0 100%);
  color: #fff; font-family: 'Cinzel Decorative', serif;
  font-size: 9px; letter-spacing: 1.5px;
  padding: 11px 26px; border-radius: 28px;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(110,40,180,0.32);
  transition: opacity 0.2s, transform 0.15s;
}
.line-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.hidden { display: none; }
</style>
</head>

const canvas = document.getElementById('heartsCanvas');

const COLORS = ['rgba(140,60,220,','rgba(160,80,200,','rgba(120,40,200,','rgba(180,100,230,','rgba(100,40,180,'];
function Heart(){ this.x=Math.random()*600; this.y=Math.random()*900; this.size=4+Math.random()*9; this.color=COLORS[Math.floor(Math.random()*COLORS.length)]; this.speed=0.3+Math.random()*0.65; this.drift=(Math.random()-0.5)*0.35; this.opacity=0.25+Math.random()*0.35; this.angle=Math.random()*Math.PI*2; this.angleSpeed=(Math.random()-0.5)*0.018; }
let hearts=[]; for(let i=0;i<18;i++) hearts.push(new Heart());
function drawHeart(x,y,s,col,op){ ctx.save(); ctx.globalAlpha=op; ctx.fillStyle=col+op+')'; ctx.beginPath(); ctx.moveTo(x,y+s*0.3); ctx.bezierCurveTo(x,y,x-s*0.5,y,x-s*0.5,y+s*0.3); ctx.bezierCurveTo(x-s*0.5,y+s*0.6,x,y+s*0.9,x,y+s); ctx.bezierCurveTo(x,y+s*0.9,x+s*0.5,y+s*0.6,x+s*0.5,y+s*0.3); ctx.bezierCurveTo(x+s*0.5,y,x,y,x,y+s*0.3); ctx.fill(); ctx.restore(); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); hearts.forEach(h=>{ h.y-=h.speed; h.x+=h.drift+Math.sin(h.angle)*0.3; h.angle+=h.angleSpeed; if(h.y<-20){h.y=canvas.height+10;h.x=Math.random()*canvas.width;} drawHeart(h.x-h.size/2,h.y-h.size/2,h.size,h.color,h.opacity); }); requestAnimationFrame(animate); }

let current = -1;
function flipCard(i) {

  document.getElementById('card'+i).classList.add('flipped');
  const c = cards[i];
