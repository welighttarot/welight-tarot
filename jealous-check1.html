<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薇光塔羅 welight_tarot - 他會吃醋嗎</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; min-height: 100%; }
body {
  background: linear-gradient(180deg, #ddd0d1 0%, #cbb7ba 100%);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 0 1rem 4rem;
  font-family: 'Noto Sans TC', sans-serif;
  position: relative;
}
.sparkle-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.branch-side { position: absolute; bottom: -10px; width: 200px; height: 58vh; max-height: 400px; opacity: 0.85; }
.branch-side.left { left: -10px; }
.branch-side.right { right: -10px; transform: scaleX(-1); }
.sparkle {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: #f3dfa8;
  box-shadow: 0 0 8px 3px rgba(243,223,168,0.65);
  animation: sparkleFloat 6s ease-in-out infinite;
}
@keyframes sparkleFloat {
  0%,100% { transform: translate(0,0); opacity: 0.25; }
  50% { transform: translate(8px,-16px); opacity: 0.9; }
}
.banner-wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 560px;
  margin-top: 1.6rem;
  border-radius: 26px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(90,60,70,0.28);
  line-height: 0;
}
.banner-wrap img { width: 100%; height: auto; display: block; }
.banner-eye-blink {
  position: absolute;
  left: 57.9%;
  top: 35.2%;
  width: 3%;
  transform: translate(-50%,-50%) scaleY(0);
  transform-origin: center;
  animation: bannerBlink 5s ease-in-out infinite;
  pointer-events: none;
}
.banner-eye-blink svg { width: 100%; height: auto; display: block; }
@keyframes bannerBlink {
  0%, 88%, 100% { transform: translate(-50%,-50%) scaleY(0); opacity: 0; }
  91% { transform: translate(-50%,-50%) scaleY(1); opacity: 1; }
  95% { transform: translate(-50%,-50%) scaleY(1); opacity: 1; }
  98% { transform: translate(-50%,-50%) scaleY(0); opacity: 0; }
}
.page {
  background: #e9e0d8;
  border-radius: 26px;
  padding: 1.9rem 1.6rem 3rem;
  position: relative; overflow: hidden; z-index: 1;
  width: 100%; max-width: 560px;
  margin-top: 14px;
  border: 1px solid rgba(160,110,120,0.16);
  box-shadow: 0 0 0 1px rgba(230,190,140,0.18), 0 10px 50px rgba(90,60,70,0.22);
}
#decorCanvas {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
}
.content { position: relative; z-index: 1; }
.fox-silhouette {
  position: absolute;
  right: -55px; top: 250px;
  width: 260px; height: 175px;
  z-index: 0;
  pointer-events: none;
  opacity: 0.55;
}
.fox-silhouette img { width: 100%; height: 100%; object-fit: contain; display: block; }

.header-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 1.8rem; }
.fox-mascot {
  flex-shrink: 0; margin-top: 2px; width: 78px; height: 78px;
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(230,190,140,0.55);
  box-shadow: 0 3px 10px rgba(90,60,70,0.2);
}
.fox-mascot img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes foxIdle {
  0%,100% { transform: translateY(0) rotate(-1.5deg); }
  50% { transform: translateY(-5px) rotate(1.5deg); }
}
.speech-bubble {
  position: relative; flex: 1;
  background: #f8f0ec;
  border: 1.5px solid rgba(160,110,120,0.22);
  border-radius: 4px 18px 18px 18px;
  padding: 0.85rem 1.05rem;
}
.brand-tag {
  font-family: 'Baloo 2', 'Noto Sans TC', sans-serif; font-weight: 700;
  color: #b8874a; font-size: 11px; letter-spacing: 1.5px; margin-bottom: 0.5rem;
}
.head-title { color: #6b4a58; font-size: 17px; font-weight: 700; margin-bottom: 0.3rem; }
.head-sub { color: #8a6a76; font-size: 12px; margin-bottom: 0.2rem; font-weight: 500; }
.head-hint { color: #a98d94; font-size: 11px; line-height: 1.6; }

.cards-row {
  display: flex; justify-content: center; align-items: flex-end; gap: 16px;
  margin-bottom: 2rem; padding-top: 14px;
}
.card-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.card-lbl { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; color: #a9793f; font-size: 12px; letter-spacing: 1px; }

.card-outer {
  width: 94px; height: 156px;
  perspective: 600px; cursor: pointer;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.4,0,0.2,1);
}
.card-outer.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  border-radius: 38px 38px 14px 14px;
  backface-visibility: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; padding: 12px 8px; text-align: center;
  box-shadow: 0 4px 20px rgba(90,60,70,0.18);
}
.card-back {
  background: linear-gradient(160deg, #efe3e6 0%, #ddc7cd 100%);
  border: 1.5px solid rgba(160,110,120,0.32);
}
.card-back::after {
  content: ''; position: absolute; inset: 7px;
  border: 1px dashed rgba(255,255,255,0.65);
  border-radius: 32px 32px 10px 10px; pointer-events: none;
}
.card-back-label { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 12px; color: #7a5566; letter-spacing: 1px; margin-top: 4px; }
.card-back-hint { font-size: 11px; color: #a98d94; margin-top: 2px; }
.card-front {
  border: 1.5px solid rgba(184,135,74,0.45);
  background: linear-gradient(160deg, #fdf3e8, #f3e0d8) !important;
  box-shadow: 0 4px 20px rgba(90,60,70,0.18), inset 0 0 0 1px rgba(230,190,140,0.3);
  transform: rotateY(180deg);
}
.card-sym { font-size: 30px; }
.card-name-main { font-size: 12px; font-weight: 700; line-height: 1.3; }
.card-name-sub { font-size: 8px; opacity: 0.6; letter-spacing: 0.4px; }

.card-outer:not(.flipped):hover .card-inner {
  transform: translateY(-8px) scale(1.04);
}
.card-outer.flipped { cursor: default; }

.result-area {
  background: #fdf8f4;
  border: 1.5px solid rgba(160,110,120,0.2);
  border-radius: 18px;
  padding: 1.3rem 1.5rem;
  box-shadow: 0 2px 16px rgba(90,60,70,0.12);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

.result-card-header {
  margin-bottom: 1rem;
  padding: 0.9rem 1rem;
  border-radius: 14px;
  background: rgba(203,183,186,0.28);
}
.result-card-name { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
.result-sym { font-size: 28px; }
.result-name-main { font-size: 18px; font-weight: 700; color: #6b4a58; line-height: 1.2; }
.result-name-sub { font-size: 11px; color: #a9793f; margin-top: 2px; }
.drawn-cards {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-top: 4px;
}
.drawn-label { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 10px; color: #b8874a; letter-spacing: 1px; }
.drawn-names { font-size: 13px; color: #7a5566; letter-spacing: 0.3px; }

.divider { color: rgba(160,110,120,0.45); text-align: center; font-size: 13px; margin-bottom: 1rem; letter-spacing: 4px; }

.status-blocks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
.status-block {
  background: #f9f1ee;
  border: 1px solid rgba(160,110,120,0.16);
  border-radius: 12px; padding: 0.9rem 1.1rem;
}
.status-header { display: flex; align-items: center; gap: 7px; margin-bottom: 0.4rem; }
.status-icon { font-size: 16px; }
.status-label { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; }
.status-text { color: #6d5661; font-size: 14px; line-height: 1.82; }

.suggest-block {
  background: linear-gradient(135deg, #f3e8ea, #ecdde1);
  border: 1px solid rgba(160,110,120,0.25);
  border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 1rem;
}
.suggest-title { font-family: 'Noto Sans TC', sans-serif; font-weight: 700; color: #a9793f; font-size: 10px; letter-spacing: 1.5px; margin-bottom: 0.4rem; }
.suggest-text { color: #6d5661; font-size: 13.5px; line-height: 1.72; }

.cta-block { text-align: center; padding: 0.5rem 0 0.2rem; }
.cta-text { color: #8a6a76; font-size: 13.5px; line-height: 1.82; margin-bottom: 0.9rem; }
.cta-text span { color: #6b4a58; font-weight: 500; }
.line-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #d4af6a 0%, #b8874a 100%);
  color: #fff; font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
  padding: 11px 28px; border-radius: 28px;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(140,100,50,0.34);
  transition: opacity 0.2s, transform 0.15s;
}
.line-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.hidden { display: none; }
</style>
</head>

<script>
const canvas = document.getElementById('decorCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; }
resize(); window.addEventListener('resize', resize);
const GLYPHS = ['✨','🐾','✨','🌙'];
function Deco(){ this.x=Math.random()*600; this.y=Math.random()*900; this.size=10+Math.random()*10; this.glyph=GLYPHS[Math.floor(Math.random()*GLYPHS.length)]; this.speed=0.3+Math.random()*0.6; this.drift=(Math.random()-0.5)*0.35; this.opacity=0.2+Math.random()*0.3; this.angle=Math.random()*Math.PI*2; this.angleSpeed=(Math.random()-0.5)*0.018; }
let decos=[]; for(let i=0;i<16;i++) decos.push(new Deco());
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); decos.forEach(d=>{ d.y-=d.speed; d.x+=d.drift+Math.sin(d.angle)*0.3; d.angle+=d.angleSpeed; if(d.y<-20){d.y=canvas.height+10;d.x=Math.random()*canvas.width;} ctx.save(); ctx.globalAlpha=d.opacity; ctx.font=d.size+'px sans-serif'; ctx.fillText(d.glyph, d.x, d.y); ctx.restore(); }); requestAnimationFrame(animate); }
animate();

let current = -1;
function flipCard(i) {
  if (current === i) { resetCards(); return; }
  if (current !== -1) document.getElementById('card'+current).classList.remove('flipped');
  current = i;
  document.getElementById('card'+i).classList.add('flipped');
  const c = cards[i];
  document.getElementById('rSym').textContent = c.sym;
  document.getElementById('rNameMain').textContent = c.label;
  document.getElementById('rNameSub').textContent = c.nameMain + '  ' + c.nameSub;
  document.getElementById('rDrawn').textContent = c.drawn;
  document.getElementById('text2').textContent = c.text;
  document.getElementById('rSuggest').textContent = c.suggest;
  const ra = document.getElementById('resultArea');
  ra.classList.remove('hidden');
  ra.style.animation = 'none';
  setTimeout(()=>{ ra.style.animation='fadeUp 0.5s ease'; },10);
}
function resetCards() {
  if (current !== -1) document.getElementById('card'+current).classList.remove('flipped');
  current = -1;
  document.getElementById('resultArea').classList.add('hidden');
}
